<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>토끼발 영화 취향표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Fredoka:wght@400;500&display=swap">
<meta name="theme-color" content="#101937">
<style>
@font-face{font-family:"LeeSeoyun";font-display:swap;
  src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/LeeSeoyun.woff") format("woff");}
/* Layout: 머뭇 유니버스 톤 — 깊은 남색 우주, 작은 놀이 행성 위 클레이 토끼, 번호 붙은 9개의 문(포스터 칸) */
:root{
  --space:#101937;        /* 우주 남색 (mumut 테마색) */
  --space2:#1a2552;
  --clay:#f6f3ec;         /* 무광 클레이 화이트 */
  --clay-shade:#dcd6c8;
  --ink:#f6f3ec;          /* 글자 */
  --ink-dark:#101937;
  --muted:#9fa8cf;
  --sun:#ffd66b;          /* 행성·달 포인트 */
  --pink:#ff9fb5;         /* 토끼 귀 */
  --card:#16214a;
  --slot:#22306a;
  --line:rgba(246,243,236,.14);
  --hand:"LeeSeoyun","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --latin:"Fredoka","Gowun Dodum",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;
  background:
    radial-gradient(1.3px 1.3px at 9% 6%,#fff 98%,transparent),
    radial-gradient(1px 1px at 81% 3%,#fff 98%,transparent),
    radial-gradient(1.5px 1.5px at 93% 19%,#fff 98%,transparent),
    radial-gradient(1px 1px at 30% 13%,#fff 98%,transparent),
    radial-gradient(1px 1px at 58% 27%,#fff 98%,transparent),
    radial-gradient(1.3px 1.3px at 4% 42%,#fff 98%,transparent),
    radial-gradient(1px 1px at 73% 57%,#fff 98%,transparent),
    radial-gradient(1px 1px at 18% 72%,#fff 98%,transparent),
    radial-gradient(1.2px 1.2px at 96% 77%,#fff 98%,transparent),
    radial-gradient(1px 1px at 47% 90%,#fff 98%,transparent),
    radial-gradient(80% 50% at 85% 0%,rgba(120,140,255,.18),transparent 70%),
    linear-gradient(180deg,var(--space) 0%,var(--space2) 100%) fixed;
  background-color:var(--space);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-block:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.topbar .brand{font-family:var(--hand);font-size:20px}
.topbar .tag{font-family:var(--latin);font-size:10.5px;letter-spacing:.22em;color:var(--muted)}

/* 취향표 카드 */
#sheet{position:relative;overflow:hidden;border-radius:28px;padding:22px 16px 20px;
  background:
    radial-gradient(1px 1px at 22% 8%,rgba(255,255,255,.85) 98%,transparent),
    radial-gradient(1.2px 1.2px at 48% 4%,rgba(255,255,255,.8) 98%,transparent),
    radial-gradient(1px 1px at 8% 20%,rgba(255,255,255,.7) 98%,transparent),
    radial-gradient(110% 55% at 100% 0%,#2a3a86 0%,transparent 62%),
    var(--card);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 50px -24px rgba(0,0,0,.7)}
.hero{position:relative;min-height:150px;padding-right:128px}
.planet{position:absolute;top:-6px;right:-10px;width:150px;height:150px;pointer-events:none}
.eyebrow{font-family:var(--latin);font-size:10.5px;letter-spacing:.24em;color:var(--sun);text-transform:uppercase;font-weight:500}
.title{font-family:var(--hand);font-weight:400;font-size:34px;line-height:1.15;margin:6px 0 8px;color:var(--clay);text-wrap:balance}
.title .br{color:var(--sun)}
#chartTitle{display:block;width:100%;border:0;background:transparent;color:var(--muted);
  font-family:var(--hand);font-size:16px;padding:2px 0;border-radius:6px}
#chartTitle:focus{outline:2px dashed var(--pink);outline-offset:3px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;margin-top:14px}
.cell{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{appearance:none;border:0;padding:0;margin:0;width:100%;aspect-ratio:2/3;max-width:100%;border-radius:16px;
  background:linear-gradient(160deg,#2a3976,var(--slot));cursor:pointer;position:relative;overflow:hidden;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font:inherit;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -6px 12px rgba(0,0,0,.18),0 8px 16px -10px rgba(0,0,0,.6);
  transition:transform .15s ease}
.slot:active{transform:scale(.97)}
.slot:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.slot .num{position:absolute;top:7px;left:9px;font-family:var(--latin);font-size:10px;letter-spacing:.12em;color:var(--muted);z-index:1}
.slot .plus{display:grid;place-items:center;opacity:.8}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tname{position:absolute;inset:auto 0 0 0;padding:18px 7px 7px;font-size:11px;line-height:1.3;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.filled .num{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.slot.textonly{background:var(--clay);color:var(--ink-dark);padding:10px;font-family:var(--hand);font-size:17px;line-height:1.25;text-align:center}
.label{font-family:var(--hand);font-size:14px;line-height:1.3;text-align:center;color:var(--ink);word-break:keep-all;min-height:2.6em}
.cell.rec .label{color:var(--sun)}
.invite{margin-top:18px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;
  background:var(--clay);color:var(--ink-dark);box-shadow:inset 0 -4px 0 var(--clay-shade)}
.invite svg{flex:none}
.invite p{margin:0;word-break:keep-all;font-family:var(--hand);font-size:18px;line-height:1.3}
.credit{margin-top:14px;text-align:center;font-family:var(--hand);font-size:14px;color:var(--muted)}
.credit b{color:var(--ink);font-weight:400}
.credit .en{display:block;font-family:var(--latin);font-size:9.5px;letter-spacing:.24em;margin-top:2px;opacity:.7}

/* 하단 버튼 */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--space2) 40%)}
.bar .in{display:flex;gap:8px;width:100%;max-width:460px}
.btn{appearance:none;border:0;background:var(--card);color:var(--ink);font:17px var(--hand);
  padding:13px 18px;border-radius:999px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px var(--line)}
.btn.primary{flex:1;background:var(--clay);color:var(--ink-dark);box-shadow:inset 0 -4px 0 var(--clay-shade),0 8px 18px -10px rgba(0,0,0,.6)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* 검색 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,8,24,.62);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:28px 28px 0 0;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.4);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .24s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.planet .bunny{animation:bob 3.2s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.panel,.planet .bunny{animation:none}}
.panel .inner{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.ptitle{font-family:var(--hand);font-weight:400;font-size:24px;margin:0 0 10px;color:var(--sun)}
.search{display:flex;gap:8px}
#q{flex:1;min-width:0;font:16px var(--body);padding:13px 16px;border-radius:999px;border:0;background:var(--space);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
#q::placeholder{color:var(--muted)}
#q:focus{outline:none;box-shadow:inset 0 0 0 2px var(--sun)}
#status{font-size:13px;color:var(--muted);margin:10px 4px 6px;min-height:1.4em}
#results{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:120px;-webkit-overflow-scrolling:touch}
#results li button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;
  padding:9px 6px;border-radius:14px;color:var(--ink);font:inherit;cursor:pointer}
#results li button:active{background:var(--slot)}
#results li button:focus-visible{outline:2px solid var(--pink)}
#results img,#results .noimg{width:46px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;background:var(--slot);flex:none}
#results .t{font-weight:700;font-size:15px;line-height:1.3}
#results .m{font-size:12px;color:var(--muted)}
.pactions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pactions .btn{flex:1;font-size:15px;padding:11px 10px;text-align:center}
.danger{color:var(--pink)}

/* 저장 미리보기 */
#shotWrap{text-align:center}
#shotWrap img{width:100%;border-radius:18px}
#shotWrap p{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">

  <section id="sheet" aria-label="토끼발 영화 취향표">

        <radialGradient id="cl" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f6f3ec"/><stop offset="1" stop-color="#d6cfbf"/></radialGradient>
      </defs>
      <circle cx="80" cy="102" r="40" fill="url(#pl)"/>
      <circle cx="66" cy="110" r="5" fill="#e3a447" opacity=".7"/><circle cx="96" cy="118" r="7" fill="#e3a447" opacity=".6"/><circle cx="98" cy="92" r="3" fill="#e3a447" opacity=".6"/>
      <ellipse cx="80" cy="104" rx="60" ry="11" fill="none" stroke="#ff9fb5" stroke-width="3" opacity=".75" transform="rotate(-14 80 104)"/>

        <ellipse cx="78" cy="52" rx="2.6" ry="11" fill="#ff9fb5" transform="rotate(10 78 52)"/>
        <ellipse cx="72" cy="86" rx="17" ry="14" fill="url(#cl)"/>
        <circle cx="70" cy="72" r="14" fill="url(#cl)"/>

      </svg>
      <p>추천영화는 토끼발 상영회에서 만나요!</p>

  </section>
</div>

<div class="bar"><div class="in">
  <button class="btn" id="resetBtn" type="button">비우기</button>
  <button class="btn primary" id="saveBtn" type="button">이미지로 저장</button>
</div></div>

<!-- 검색 시트 -->
<div class="scrim" id="scrim" hidden></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" hidden>
  <div class="inner">
    <div class="grab"></div>
    <h2 class="ptitle" id="ptitle">영화 고르기</h2>

      <input id="q" type="search" placeholder="영화 제목을 대충 적어도 돼요" autocomplete="off" enterkeyhint="search">

</div>

<!-- 저장 미리보기 -->
<div class="scrim" id="scrim2" hidden></div>
<div class="panel" id="shotPanel" role="dialog" aria-modal="true" aria-label="저장할 이미지" hidden>
  <div class="inner" id="shotWrap">
    <div class="grab"></div>
    <div id="shotBody"></div>
    <button class="btn" id="closeShot" type="button" style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const LABELS=[
  "대외적 최애 영화","남들에게 말 안하는 최애 영화","나만 좋아할 것 같은 영화",
  "제일 많이 다시 본 영화","한때 최애 영화","내 인생이 담겨있는 영화",
  "이 영화처럼 살고 싶다","최근에 발견한 명작","지금 사람들한테 추천할 영화"
];
const KEY="tokkibal-taste-v1";
let state={title:"나는 영화가 너무너무 좋다",slots:Array(9).fill(null)};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.slots))state=s;}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const grid=document.getElementById("grid");
const titleEl=document.getElementById("chartTitle");
titleEl.value=state.title;
titleEl.addEventListener("input",()=>{state.title=titleEl.value;persist();});

function render(){
  grid.innerHTML="";
  LABELS.forEach((label,i)=>{
    const cell=document.createElement("div");cell.className="cell"+(i===8?" rec":"");
    const b=document.createElement("button");b.type="button";b.className="slot";
    const m=state.slots[i];const num=String(i+1).padStart(2,"0");
    if(m&&m.img){
      const img=document.createElement("img");img.src=m.img;img.alt=m.title||"";img.loading="lazy";
      img.onerror=()=>{b.classList.add("textonly");img.remove();};
      b.appendChild(img);b.classList.add("filled");
      if(m.title){const t=document.createElement("span");t.className="tname";t.textContent=m.title;b.appendChild(t);}
      b.setAttribute("aria-label",label+": "+(m.title||"내 사진")+" (바꾸기)");
    }else if(m&&m.title){
      b.classList.add("textonly");b.textContent=m.title;
      b.setAttribute("aria-label",label+": "+m.title+" (바꾸기)");
    }else{
      b.innerHTML='<span class="plus" aria-hidden="true"><svg width="30" height="36" viewBox="0 0 30 36"><ellipse cx="10" cy="9" rx="3" ry="8" fill="currentColor" opacity=".5"/><ellipse cx="20" cy="9" rx="3" ry="8" fill="currentColor" opacity=".5"/><circle cx="15" cy="25" r="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/><path d="M15 20v10M10 25h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>';
      b.setAttribute("aria-label",label+" 고르기");
    }
    b.addEventListener("click",()=>openPanel(i));
    if(!b.classList.contains("textonly")){const n=document.createElement("span");n.className="num";n.textContent=num;b.prepend(n);}
    const l=document.createElement("div");l.className="label";l.textContent=label;
    cell.append(b,l);grid.appendChild(cell);
  });
}

/* ---------- 영화 검색 (iTunes 영화 DB, 키 불필요) ---------- */
let jsonpN=0;
function jsonp(url,ms=8000){
  return new Promise((res,rej)=>{
    const cb="__mv"+(++jsonpN)+Date.now();
    const s=document.createElement("script");
    const done=()=>{delete window[cb];s.remove();clearTimeout(t);};
    const t=setTimeout(()=>{done();rej(new Error("timeout"));},ms);
    window[cb]=d=>{done();res(d);};
    s.onerror=()=>{done();rej(new Error("load"));};
    s.src=url+"&callback="+cb;document.head.appendChild(s);
  });
}
async function searchMovies(term){
  const base="https://itunes.apple.com/search?media=movie&entity=movie&limit=25&term="+encodeURIComponent(term);
  const [kr,us]=await Promise.allSettled([
    jsonp(base+"&country=KR&lang=ko_kr"),
    jsonp(base+"&country=US")
  ]);
  const out=[],seen=new Set();
  for(const r of [kr,us]){
    if(r.status!=="fulfilled"||!r.value||!r.value.results)continue;
    for(const x of r.value.results){
      const key=(x.trackName||"")+"|"+(x.releaseDate||"").slice(0,4);
      if(seen.has(key))continue;seen.add(key);
      out.push({
        title:x.trackName,
        year:(x.releaseDate||"").slice(0,4),
        director:x.artistName||"",
        img:x.artworkUrl100?x.artworkUrl100.replace(/\/\d+x\d+bb\./,"/400x600bb."):null
      });
    }
  }
  if(kr.status==="rejected"&&us.status==="rejected")throw new Error("network");
  return out;
}

/* ---------- 패널 ---------- */
const panel=document.getElementById("panel"),scrim=document.getElementById("scrim");
const q=document.getElementById("q"),results=document.getElementById("results"),statusEl=document.getElementById("status");
const ptitle=document.getElementById("ptitle");
let current=-1,timer=null,seq=0;

function openPanel(i){
  current=i;ptitle.textContent=LABELS[i];
  q.value="";results.innerHTML="";statusEl.textContent="제목 일부만 적어도 찾아줘요. 한글·영어 둘 다 돼요.";
  panel.hidden=false;scrim.hidden=false;document.body.style.overflow="hidden";
  setTimeout(()=>q.focus(),60);
}
function closePanel(){panel.hidden=true;scrim.hidden=true;document.body.style.overflow="";current=-1;}
scrim.addEventListener("click",closePanel);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePanel();closeShot();}});

q.addEventListener("input",()=>{
  clearTimeout(timer);
  const term=q.value.trim();
  if(term.length<1){results.innerHTML="";statusEl.textContent="";return;}
  statusEl.textContent="찾는 중…";
  timer=setTimeout(()=>run(term),350);
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);const t=q.value.trim();if(t)run(t);}});

async function run(term){
  const my=++seq;
  try{
    const list=await searchMovies(term);
    if(my!==seq)return;
    results.innerHTML="";
    if(!list.length){statusEl.textContent="찾는 영화가 없어요. 다르게 적어보거나 ‘제목만 넣기’를 눌러요.";return;}
    statusEl.textContent=list.length+"편 찾았어요";
    for(const m of list){
      const li=document.createElement("li");const b=document.createElement("button");b.type="button";
      if(m.img){const im=document.createElement("img");im.src=m.img.replace("400x600bb","100x150bb");im.alt="";im.loading="lazy";b.appendChild(im);}
      else{const d=document.createElement("div");d.className="noimg";b.appendChild(d);}
      const tx=document.createElement("div");
      const t=document.createElement("div");t.className="t";t.textContent=m.title;
      const mm=document.createElement("div");mm.className="m";mm.textContent=[m.year,m.director].filter(Boolean).join(" · ");
      tx.append(t,mm);b.appendChild(tx);
      b.addEventListener("click",()=>pick({title:m.title,img:m.img,year:m.year}));
      li.appendChild(b);results.appendChild(li);
    }
  }catch(e){
    if(my!==seq)return;
    statusEl.textContent="검색 서버에 연결하지 못했어요. 인터넷 연결을 확인하거나 ‘제목만 넣기’를 써요.";
  }
}
function pick(m){if(current<0)return;state.slots[current]=m;persist();render();closePanel();}
document.getElementById("useText").addEventListener("click",()=>{
  const t=q.value.trim();if(!t){statusEl.textContent="먼저 제목을 적어주세요.";q.focus();return;}
  pick({title:t,img:null});
});
document.getElementById("clearSlot").addEventListener("click",()=>{if(current<0)return;state.slots[current]=null;persist();render();closePanel();});
document.getElementById("upload").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{ // 작게 줄여서 저장
    const w=400,h=600,c=document.createElement("canvas");c.width=w;c.height=h;
    const r=Math.max(w/img.width,h/img.height),dw=img.width*r,dh=img.height*r;
    c.getContext("2d").drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(url);
    pick({title:q.value.trim()||"",img:c.toDataURL("image/jpeg",.82)});e.target.value="";
  };
  img.src=url;
});

/* ---------- 비우기 ---------- */
const resetBtn=document.getElementById("resetBtn");let armed=false,armT;
resetBtn.addEventListener("click",()=>{
  if(!armed){armed=true;resetBtn.textContent="한 번 더";armT=setTimeout(()=>{armed=false;resetBtn.textContent="비우기";},2500);return;}
  clearTimeout(armT);armed=false;resetBtn.textContent="비우기";
  state.slots=Array(9).fill(null);persist();render();
});

/* ---------- 이미지 저장 ---------- */
const shotPanel=document.getElementById("shotPanel"),scrim2=document.getElementById("scrim2"),shotBody=document.getElementById("shotBody");
function closeShot(){shotPanel.hidden=true;scrim2.hidden=true;document.body.style.overflow="";}
scrim2.addEventListener("click",closeShot);
document.getElementById("closeShot").addEventListener("click",closeShot);
document.getElementById("saveBtn").addEventListener("click",async()=>{
  if(!window.html2canvas){alertBox("이미지 저장 도구를 불러오지 못했어요. 화면을 캡처해 주세요.");return;}
  const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="만드는 중…";
  try{
    const canvas=await html2canvas(document.getElementById("sheet"),{
      scale:Math.min(3,window.devicePixelRatio||2),useCORS:true,
      backgroundColor:"#101937"
    });
    const data=canvas.toDataURL("image/png");
    shotBody.innerHTML='<p>이미지를 길게 눌러 사진에 저장하세요</p>';
    const im=new Image();im.src=data;im.alt="완성된 영화 취향표";shotBody.appendChild(im);
    const a=document.createElement("a");a.href=data;a.download="영화취향표.png";a.className="btn primary";
    a.style.cssText="display:block;margin-top:10px;text-decoration:none";a.textContent="파일로 내려받기";shotBody.appendChild(a);
  }catch(e){
    shotBody.innerHTML='<p>이미지를 만들지 못했어요. 이 화면을 캡처해서 저장해 주세요.</p>';
  }
  shotPanel.hidden=false;scrim2.hidden=false;document.body.style.overflow="hidden";
  btn.disabled=false;btn.textContent="이미지로 저장";
});
function alertBox(msg){shotBody.innerHTML="<p></p>";shotBody.firstChild.textContent=msg;shotPanel.hidden=false;scrim2.hidden=false;}

render();
</script>
</body>
</html>
